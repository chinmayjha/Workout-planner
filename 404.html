<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 - Page Not Found | Workout Planner</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  
  <style>
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .error-title {
      font-size: 8rem;
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      line-height: 1;
    }
    .error-msg {
      font-size: 1.2rem;
      color: var(--muted);
      margin-bottom: 40px;
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <h1 class="error-title">404</h1>
    <p class="error-msg">Looks like this rep didn't count. Page not found.</p>
    <a href="/" class="btn btn-primary hover-elevate" style="max-width: 250px; text-decoration: none; display: inline-block;">Back to Workout Planner</a>
  </div>
</body>
</html>
